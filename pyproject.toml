[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "tapewright"
dynamic = ["version"]
description = "Label designer and driver for Brother P-touch label printers (PT-P700 and compatible)"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "dimschlukas" }]
requires-python = ">=3.10"
dependencies = ["PyGObject>=3.42", "pycairo>=1.20", "Pillow>=9.0"]
keywords = ["label", "printer", "p-touch", "pt-p700", "gtk"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: GTK",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Printing",
]

[project.optional-dependencies]
qr = ["qrcode>=7"]

[project.urls]
Homepage = "https://github.com/dimschlukas/tapewright"
Issues = "https://github.com/dimschlukas/tapewright/issues"

[project.scripts]
tapewright = "tapewright.cli:main"

[project.gui-scripts]
tapewright-gui = "tapewright.cli:gui_entry"

[tool.setuptools]
packages = ["tapewright"]

[tool.setuptools.package-data]
tapewright = ["icons/hicolor/scalable/actions/*.svg"]

[tool.setuptools.dynamic]
version = { attr = "tapewright.__version__" }

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "I"]
